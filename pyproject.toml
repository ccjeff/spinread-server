[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spinread-server"
version = "0.1.0"
description = "SpinRead MLP backend: upload -> pipeline -> timeline -> streaming playback"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "boto3>=1.34",
    "pyjwt>=2.8",
    "pydantic>=2",
    "pydantic-settings>=2",
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

# The analysis POC is consumed as an editable local dependency; pip cannot
# express that in project.dependencies. Install manually:
#   pip install -e ../pingpong-training

[tool.setuptools.packages.find]
include = ["spinread*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
