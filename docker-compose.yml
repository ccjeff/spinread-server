services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spinread
      POSTGRES_USER: spinread
      POSTGRES_PASSWORD: spinread
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spinread -d spinread"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # quay.io mirror of minio/minio; use docker.io minio/minio:latest if reachable.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # MinIO dropped the S3 PutBucketCors API; browser CORS is set here.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  miniodata:
